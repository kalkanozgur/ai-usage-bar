name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset msvc-release
      - name: Build
        run: cmake --build --preset msvc-release
      - name: Test
        run: ctest --preset msvc-release
      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-bar
          path: build/msvc-release/claude-usage-bar.exe

  linux-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux-tests
      - name: Build
        run: cmake --build --preset linux-tests
      - name: Test
        run: ctest --preset linux-tests
